name: Generar imágenes del perfil

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Viborita de contribuciones
        uses: Platane/snk@v3
        with:
          github_user_name: scheffan
          outputs: |
            salida/dist/github-contribution-grid-snake.svg
            salida/dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Contribuciones en 3D
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: scheffan

      - name: Juntar imágenes
        run: mv profile-3d-contrib salida/

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: salida
          commit_message: "Actualizar imágenes del perfil"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
